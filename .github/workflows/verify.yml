name: Verify public dataset and notebook

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify notebook generation is deterministic
        run: |
          python scripts/create_notebook.py
          git diff --exit-code -- notebooks/analise_bardojonas.ipynb
      - name: Execute notebook with a clean Jupyter kernel
        run: |
          jupyter nbconvert --to notebook --execute notebooks/analise_bardojonas.ipynb \
            --output analise_executed.ipynb --output-dir /tmp \
            --ExecutePreprocessor.timeout=180
